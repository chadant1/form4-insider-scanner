name: Build Windows app

# Builds Form4Scanner.exe + Form4Scanner-Setup.exe on every push to main
# and publishes them as the "latest" GitHub Release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read app version
        shell: bash
        run: echo "APP_VERSION=$(python -c 'import form4_scanner as f; print(f.APP_VERSION)')" >> "$GITHUB_ENV"

      - name: Run offline tests
        run: python tests/test_scanner.py

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build Form4Scanner.exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name Form4Scanner --icon assets/app.ico
          --add-data "assets/app.ico;assets" --add-data "assets/app.png;assets"
          form4_scanner.py

      - name: Build installer (Inno Setup)
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\Form4Scanner.iss

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Form4Scanner-windows
          path: dist/*.exe

      - name: Publish "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          files="dist/Form4Scanner.exe"
          if [ -f dist/Form4Scanner-Setup.exe ]; then files="dist/Form4Scanner-Setup.exe $files"; fi
          gh release create latest $files \
            --target "$GITHUB_SHA" \
            --title "Form 4 Insider Scanner v${APP_VERSION}" \
            --notes "Automatic build of commit ${GITHUB_SHA::7}.

          **Form4Scanner-Setup.exe** - installs the app with a Start-menu (and optional desktop) shortcut. Recommended.
          **Form4Scanner.exe** - portable single file; just double-click to run.

          Windows SmartScreen may warn because the app is not code-signed: click *More info* -> *Run anyway*."
